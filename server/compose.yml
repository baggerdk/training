# power-krop backend. No ports are published to the host: traffic from outside comes only through
# Cloudflare Tunnel (the cloudflared service, "tunnel" profile). For local development use compose.dev.yml:
#   docker compose -f compose.yml -f compose.dev.yml up --build
name: powerkrop

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: powerkrop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Sæt POSTGRES_PASSWORD i server/.env}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Sæt OWNER_PASSWORD i server/.env}
      APP_PASSWORD: ${APP_PASSWORD:?Sæt APP_PASSWORD i server/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d powerkrop"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Runs the migrations as powerkrop_owner and exits. The API waits for it, so the API container never holds
  # the owner password. Also used for scripts: docker compose run --rm migrate node src/scripts/create-admin.ts …
  migrate:
    build: &api-build
      context: ..                      # repo root: the image also needs the app's shared js/ and img/
      dockerfile: server/api/Dockerfile
    image: powerkrop-api
    restart: "no"
    command: ["node", "src/migrate.ts"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      INVITE_BASE_URL: ${INVITE_BASE_URL:?Sæt INVITE_BASE_URL i server/.env}

  api:
    build: *api-build
    image: powerkrop-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      APP_PASSWORD: ${APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Sæt JWT_SECRET i server/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,https://baggerdk.github.io}
      INVITE_BASE_URL: ${INVITE_BASE_URL:?Sæt INVITE_BASE_URL i server/.env}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      APK_URL: ${APK_URL:-}
      APK_DIR: /app/apk
    volumes:
      # The published APK + version.json (server/apk, not in git) – see GET /app
      - ./apk:/app/apk:ro

  # Nightly pg_dump with 14 days' rotation to ./backups (on the LXC's disk; vzdump of the LXC takes it off the node)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Copenhagen
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./backup/backup.sh:/backup.sh:ro
      - ./backup/restore.sh:/restore.sh:ro
    healthcheck:
      # Unhealthy if the last good dump is more than 26 hours old
      test: ["CMD-SHELL", "test -f /backups/last-ok && [ $(( $(date +%s) - $(date -d \"$(cat /backups/last-ok | cut -c1-19 | tr T ' ')\" +%s) )) -lt 93600 ]"]
      interval: 1h
      timeout: 10s
      start_period: 2m
      retries: 1

  # Cloudflare Tunnel (remotely managed): outbound connection only. The public hostname → http://api:3000
  # mapping lives in Cloudflare. Only runs with the "tunnel" profile (COMPOSE_PROFILES=tunnel in server/.env on the server).
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
