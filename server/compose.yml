# power-krop backend. No ports are published to the host: traffic from outside comes only through
# Cloudflare Tunnel (the cloudflared service, "tunnel" profile). For local development use compose.dev.yml:
#   docker compose -f compose.yml -f compose.dev.yml up --build
name: powerkrop

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: powerkrop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Sæt POSTGRES_PASSWORD i server/.env}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Sæt OWNER_PASSWORD i server/.env}
      APP_PASSWORD: ${APP_PASSWORD:?Sæt APP_PASSWORD i server/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d powerkrop"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..                      # repo root: the image also needs the app's shared js/ and img/
      dockerfile: server/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Sæt JWT_SECRET i server/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,https://baggerdk.github.io}
      INVITE_BASE_URL: ${INVITE_BASE_URL:?Sæt INVITE_BASE_URL i server/.env}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      APK_URL: ${APK_URL:-}
      APK_DIR: /app/apk
    volumes:
      # The published APK + version.json (server/apk, not in git) – see GET /app
      - ./apk:/app/apk:ro

  # Cloudflare Tunnel (remotely managed): outbound connection only. The public hostname → http://api:3000
  # mapping lives in Cloudflare. Only runs with the "tunnel" profile (COMPOSE_PROFILES=tunnel in server/.env on the server).
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
